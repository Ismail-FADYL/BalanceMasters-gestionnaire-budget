<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Budget Personnel</title>
    <link rel="stylesheet" href="Style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="budget-container">
        <h1>Gestionnaire de Budget</h1>

        <div class="input-section card">
            <h2>Ajouter une Transaction</h2>
            <div class="form-group">
                <label for="type">Catégorie:</label>
                <select id="type">
                    <option value="revenu">Revenu</option>
                    <option value="depense">Dépense</option>
                </select>
            </div>
            <div class="form-group">
                <label for="montant">Montant:</label>
                <input type="number" id="montant" placeholder="Montant">
            </div>
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date">
            </div>
            <button id="ajouterTransaction" class="primary">Ajouter</button>
            <p id="message"></p>
        </div>

        <div class="overview-section card">
            <h2>Aperçu</h2>
            <p>Solde actuel: <span id="solde">0.00 DH</span></p>
        </div>

        <div class="chart-container card">
            <canvas id="myChart"></canvas>
        </div>

        <div class="monthly-section card">
            <h3>Récapitulatif Mensuel</h3>
            <p>Total Revenus (ce mois): <span id="monthly-revenues">0.00</span> DH</p>
            <p>Total Dépenses (ce mois): <span id="monthly-expenses">0.00</span> DH</p>
        </div>

        <div class="transactions-section card">
            <h2>Historique des Transactions</h2>
            <ul id="transactions">
                </ul>
        </div>
    </div>

    <script src="Script.js"></script>
</body>
</html>
