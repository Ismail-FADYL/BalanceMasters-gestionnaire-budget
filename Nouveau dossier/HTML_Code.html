<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Budget</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="Style.css">
    
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <i class="fas fa-wallet"></i>
            <span>Budget App</span>
        </div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="#" class="nav-link active" data-section="overview">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Aperçu</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" data-section="chart">
                    <i class="fas fa-chart-line"></i>
                    <span>Diagramme</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" data-section="monthly">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Récapitulatif</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" data-section="transactions">
                    <i class="fas fa-list-alt"></i>
                    <span>Historique</span>
                </a>
            </li>
        </ul>
    </aside>

    <main class="main-content">
        <h1 class="page-title">Gestionnaire de Budget</h1>

        <div class="input-section card">
            <h2 class="card-title">Ajouter une Transaction</h2>
            <div class="form-group">
                <label for="type">Catégorie :</label>
                <select id="type" class="form-control">
                    <option value="revenu">Revenu</option>
                    <option value="depense">Dépense</option>
                </select>
            </div>
            <div class="form-group">
                <label for="montant">Montant :</label>
                <input type="number" id="montant" class="form-control" placeholder="0.00" step="0.01" min="0">
            </div>
            <div class="form-group">
                <label for="date">Date :</label>
                <input type="date" id="date" class="form-control">
            </div>
            <button id="ajouterTransaction" class="btn">Ajouter</button>
            <p id="message"></p>
        </div>

        <div id="overview" class="overview-section card">
            <h2 class="card-title">Aperçu</h2>
            <p>Solde actuel : <span id="solde">0.00 DH</span></p>
        </div>

        <div id="chart" class="chart-container card hidden">
            <h2 class="card-title">Évolution Financière</h2>
            <canvas id="myChart"></canvas>
        </div>

        <div id="monthly" class="monthly-section card hidden">
            <h2 class="card-title">Récapitulatif Mensuel</h2>
            <p>Total Revenus (ce mois) : <span id="monthly-revenues">0.00</span> DH</p>
            <p>Total Dépenses (ce mois) : <span id="monthly-expenses">0.00</span> DH</p>
        </div>

        <div id="transactions" class="transactions-section card hidden">
            <h2 class="card-title">Historique des Transactions</h2>
            <ul id="transactions-list"></ul>
        </div>
    </main>
     <script src="Script.js"></script>
</body>
</html>
