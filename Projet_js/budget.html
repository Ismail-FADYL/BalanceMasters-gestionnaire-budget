<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Budget Personnel</title>
    <link rel="stylesheet" href="body.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    
    <div class="budget-container">
        <h1>Gestionnaire de Budget</h1>

        <div class="input-section">
            <h2>Ajouter une Transaction</h2>
            <label for="type">Catégorie:</label>
            <select id="type">
                <option value="revenu">Revenu</option>
                <option value="depense">Dépense</option>
            </select><br><br>

            <label for="montant">Montant:</label>
            <input type="number" id="montant"><br><br>
            
            <label for="date">Date:</label>
            <input type="date" id="date"><br><br>

            <button id="ajouterTransaction">Ajouter</button>
            <p id="message"></p>
        </div>

        <canvas id="myChart"></canvas>


        <div class="overview-section">
            <h2>Aperçu</h2>
            <p>Solde actuel: <span id="solde">0.00</span></p>
            <h3>Comparaison Revenus / Dépenses</h3>
            <canvas id="budgetComparisonChart" width="400" height="200"></canvas>
        </div>
        <div class="monthly-section">
            <h2>Transactions du Mois Courant</h2>
            <ul id="monthly-transactions">
            </ul>
            <h3>Récapitulatif Mensuel</h3>
            <p>Total Revenus (ce mois): <span id="monthly-revenues">0.00</span> €</p>
            <p>Total Dépenses (ce mois): <span id="monthly-expenses">0.00</span> €</p>
        </div>

        <div class="transactions-section">
            <h2>Historique des Transactions</h2>
            <ul id="transactions">
                </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
